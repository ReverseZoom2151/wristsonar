[project]
name = "wristsonar"
version = "0.0.1"
description = "3D hand pose from the speaker and microphone already inside a stock smartwatch, reported with the protocol that produced it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "ReverseZoom2151" }]
dependencies = ["numpy>=1.26,<2.0", "scipy>=1.11,<1.15"]

[project.optional-dependencies]
train = ["torch>=2.2"]
prepare = ["opencv-python>=4.9", "mediapipe>=0.10"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/ReverseZoom2151/wristsonar"

[project.scripts]
wristsonar = "wristsonar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wristsonar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # The suite must pass on a machine that has downloaded nothing, so any
    # test needing a real dataset carries this and skips cleanly without it.
    "dataset: requires a downloaded dataset, skipped by default",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Checked against the supported floor rather than the development version, so
# a 3.12-only construct is caught here rather than by a 3.11 user.
python_version = "3.11"
strict = true
files = ["src", "tests"]
# NumPy's scalar generics are version-sensitive across the supported 1.26
# range.  Requiring every annotation to select a private precision parameter
# buys no safety at this boundary, so retain the concrete NDArray dtypes while
# allowing bare NumPy scalar generics.
disallow_any_generics = false
# SciPy has no 3.11-parseable stubs.  Its calls are isolated in the DSP layer
# and covered by deterministic signal tests, so do not reject a typed wrapper
# merely because the external function appears as Any to MyPy.
warn_return_any = false

# SciPy does not publish stubs that can be parsed under the 3.11 target. Our
# own boundary types stay strict; calls into SciPy are covered by signal tests.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mediapipe", "mediapipe.*"]
ignore_missing_imports = true
